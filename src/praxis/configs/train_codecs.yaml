# Top-level codec training config
defaults:
  - codecs@codec: tokens/oat
  - dataset: libero
  - trainer: codecs
  - train_recipe/codecs@_global_: default
  - optional train_recipe/codecs: null
  - optional codec@codec: null
  - _self_

name: train_codecs
seed: 42
device: cuda
run_name: ${now:%H%M%S}_${name}_${codec.name}_${dataset.name}
output_dir: outputs/train_codecs/${now:%Y%m%d}/${run_name}
run_mode: overwrite        # overwrite output_dir unless run_mode=resume
resume_checkpoint: null   # required checkpoint dir when run_mode=resume

hydra:
  job:
    override_dirname: ${name}
  run:
    dir: ${output_dir}
  sweep:
    dir: outputs/train_codecs/${now:%Y%m%d}/${run_name}
    subdir: ${hydra.job.num}
