# Policy trainer configuration: behavior only. Method-specific optimizer
# values live in train_recipe/policy/*.
defaults:
  - common
  - _self_

_trainer_type: policy

# Policy training uses structured family LRs supplied by train_recipe/policy/*.
lrs: null

# Reconstruction eval (action prediction MSE on val set)
reconst_every: 1000          # every N steps
max_reconst_batches: 100     # max val batches for reconstruction (null = all)
reconst_action_mode: policy  # policy | zero | hold (repeat observation.state)

# Sim eval (optional; set a non-null interval to opt in)
sim_eval_every: null             # run sim eval every N optimizer steps (null to disable)
sim_eval_start_after_step: 0     # skip sim eval until global_step is greater than this
sim_eval:
  num_eval_per_task: 20          # episodes per task per eval
  num_parallel_env: 1            # persistent eval lane count
  record_episodes_per_task: 0
  step_timeout_sec: null         # optional async reset/step timeout; null disables
  rollout_failure_retries: 1     # rebuild/retry a wave after native async worker EOF
  policy_kwargs: {}              # forwarded to policy.predict_action during sim eval
