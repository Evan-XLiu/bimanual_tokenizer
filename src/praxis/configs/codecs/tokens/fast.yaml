# FAST token codec config (DCT + BPE compression)
name: fast
kind: tokens
pretrained_path: null

# Action/sample geometry
action_dim: null
action_horizon: 32
max_fit_chunks: 50000
action_normalization_mode: dataset_min_max

# DCT quantization
scale: 10.0
min_token: 0

# Token sequence and encoding
max_token_length: 128
strict_decode: false
bpe_tokenizer_path: physical-intelligence/fast
vocab_size: 1024
