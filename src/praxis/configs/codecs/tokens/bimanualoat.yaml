# Paired bimanual OAT token codec config
name: bimanualoat
kind: tokens
pretrained_path: null

# Action/sample geometry (left arm followed by right arm)
action_dim: null
action_horizon: 32
max_fit_chunks: 50000
latent_horizon: 16
right_arm_sign: [-1, 1, 1, 1, -1, -1, 1]

# Shared transformer dims
emb_dim: 256
head_dim: 32
encoder_depth: 6
decoder_depth: 6
dropout: 0.1

# Decoder prefix-dropout schedule over ordered paired latents
latent_dropout_mode: pow2

# Independent common and relative FSQ streams
common_quantizer_levels: [8, 6]
relative_quantizer_levels: [8, 6]
quantizer_drop_quant_p: 0.0
quantizer_corrupt_tokens_p: 0.0
quantizer_min_corrupt_tokens_p: null
quantizer_apply_corrupt_tokens_p: 0.2
