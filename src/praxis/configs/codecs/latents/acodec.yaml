# ActionCodec latent codec config
name: acodec
kind: latents
pretrained_path: null

# Action/sample geometry
action_dim: null
action_horizon: 32
latent_horizon: 16

# Model dims
emb_dim: 256
latent_dim: 512
head_dim: 32
encoder_depth: 6
decoder_depth: 6
dropout: 0.1
mlp_ratio: 4.0
qk_norm: ln
layer_scale: true
pos_scale: 0.1
encoder_add_self_attn: false
encoder_add_causal_mask: false
decoder_add_self_attn: false
decoder_add_causal_mask: false

# Standalone latent-space training controls
latent_space:
  regularization:
    enabled: true
    mean_weight: 0.001
    variance_weight: 0.001
    covariance_weight: 0.0
    norm_weight: 0.0
  decoder_noise_std: 0.0
