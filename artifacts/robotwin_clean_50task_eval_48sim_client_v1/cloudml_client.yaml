    nodeNumber: 3
    perNodeResourceSpec:
      resourcePriority: GUARANTEED_PUBLIC
      resourceName: cloudml.nv1h20-8-8.21-225
      resourceNumber: 8
    elastic: false
    preemptible: false
enableTensorboard: false
enableMetrics: false
retryConfig:
  enableRetry: false
  maxRetryTimes: 0
  policySets: []
rdma: false
