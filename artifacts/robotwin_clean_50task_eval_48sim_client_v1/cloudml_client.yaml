jobName: praxis-robotwin-clean50-ar-bin-ema10095-24xh20-48sim-client-v16
description: Official RoboTwin 2.0 demo_clean evaluation of final EMA step10095 AR H32 BIN policy; 50 tasks, 20 episodes per task, seen instructions, seed group 0; 48 simulator workers on 24 H20 GPUs, policy served by separate 16-GPU task.
accessType: PRIVATE
imageConfig:
  imageUrl: micr.cloud.mioffice.cn/robot-rfm-hxs/bsp-base-common-exp:3055471-verified-1
  imageCommand: exec bash -lc 'cd /robot/robot-research-exp-0/user/hxs/praxis-vla && git show origin/hxs/codex/robotwin-integration:artifacts/robotwin_clean_50task_eval_48sim_client_v1/run_client.sh | sed -e s/20260814-v7/20260814-v16/ -e s/robotwin_client_v12/robotwin_client_v16/ > /tmp/robotwin_client_v16.sh && chmod +x /tmp/robotwin_client_v16.sh; bash /tmp/robotwin_client_v16.sh; rc=$?; for log in /robot/robot-research-exp-0/user/hxs/praxis-vla/outputs/robotwin2_clean/*v16/_logs/*.log; do [ -f "$log" ] || continue; echo "===== $log ====="; tail -n 240 "$log"; done; exit $rc'
modelUri: ""
envConfigs:
  - key: NVIDIA_DRIVER_CAPABILITIES
    value: all
juiceFsMountConfigs:
  - volume: robot-research-raw-data-0
    juiceFsCluster: bj9-cloudml-ali2
    subPath: /
    mountPath: /robot/robot-research-raw-data-0
    readOnly: true
  - volume: robot-research-exp-0
    juiceFsCluster: bj9-cloudml-ali2
    subPath: /
    mountPath: /robot/robot-research-exp-0
    readOnly: false
queueId: "9543"
priority: 8
preemptible: false
framework: pytorch
resourceConfigs:
