codec:
  name: oat
  kind: tokens
  pretrained_path: null
  action_dim: 14
  action_horizon: 32
  max_fit_chunks: 50000
  latent_horizon: 16
  emb_dim: 256
  head_dim: 32
  encoder_depth: 6
  decoder_depth: 6
  dropout: 0.1
  latent_dropout_mode: pow2
  quantizer_levels:
  - 8
  - 8
  - 6
  - 5
  quantizer_drop_quant_p: 0.0
  quantizer_corrupt_tokens_p: 0.0
  quantizer_min_corrupt_tokens_p: null
  quantizer_apply_corrupt_tokens_p: 0.2
dataset:
  name: bicat_joint_all
  repo_id: local/bicat_yam_joint_all
  root: /scratch/xuanweiliu/bimanual_tokenizer/data/BiCAT-BimanualYAM-JointOnly
  hf_datasets_cache: /scratch/xuanweiliu/bimanual_tokenizer/.cache/huggingface/datasets
  episodes: null
  action_key: action_joint_angles
  exclude_episodes_file: null
  action_stats_file: null
  observation_keys: []
  video_backend: pyav
  bypass_force_cache_sync: true
trainer:
  max_steps: 300000
  batch_size: 512
  global_batch_size: 512
  num_workers: 4
  prefetch_factor: 4
  use_episode_aware_sampler: true
  drop_n_first_frames: 0
  drop_n_last_frames: 0
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  lr_scheduler: constant
  warmup_steps: 200
  warmup_steps_by_family: null
  min_lr_ratio: 0.1
  lr_decay_steps: null
  use_ema: true
  ema_decay: 0.995
  mixed_precision: bf16
  gradient_accumulation_steps: 1
  find_unused_parameters: false
  max_grad_norm: 1.0
  distributed_strategy: ddp
  fsdp_min_num_params: 100000000
  fsdp_reshard_after_forward: true
  fsdp_cpu_offload: false
  log_every: 200
  val_every: 0
  checkpoint_every: 0
  checkpoint_start_step: 300000
  checkpoint_dir: ${output_dir}/checkpoints
  local_log_path: ${output_dir}/train_metrics.jsonl
  val_ratio: 0.0
  split_seed: ${seed}
  val_batch_size: null
  max_val_batches: 100
  checkpoint_candidates:
    best:
      metric_key: val_reconst_loss
      mode: min
      k: 0
    recent:
      k: 0
  use_wandb: true
  wandb_project: Realworld
  wandb_entity: evan_lxw-harbin-institute-of-technology
  wandb_init_timeout: null
  wandb_upload_eval_videos: false
  wandb_max_eval_videos: 16
  _trainer_type: codecs
  lr: 5.0e-05
  reconst_every: 5000
  max_reconst_batches: null
  reconstruct_on_train: true
  skip_codec_fit: false
  wandb_required: true
name: train_codecs
seed: 42
device: cuda
run_name: Realworld_OAT_14joint_300000_bs512
output_dir: /scratch/xuanweiliu/bimanual_tokenizer/realworld_OAT/AT
run_mode: overwrite
resume_checkpoint: null
