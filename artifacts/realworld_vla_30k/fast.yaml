policy:
  pretrained_path: null
  vlm_model_name: /scratch/xuanweiliu/bimanual_tokenizer/.cache/models/Molmo2-ER
  vlm_dtype: bfloat16
  freeze_vision_encoder: false
  use_lora: false
  lora_r: 64
  lora_alpha: 16
  lora_target_modules:
  - att_proj
  - attn_out
  - ff_proj
  - ff_out
  lora_dropout: 0.05
  lora_modules_to_save:
  - lm_head
  - wte
  gradient_checkpointing: true
  action_token_template: <|action_{i}|>
  action_mask_token_template: <|action_mask|>
  action_embed_init: normal
  state_prefix_encoding: discrete_text
  state_prefix_num_bins: 256
  default_instruction: Analyze the input image(s) and predict robot actions.
  action_dim: null
  n_obs_steps: 1
  action_horizon: 32
  n_action_steps: 16
  action_tokenizer:
    name: fast
    kind: tokens
    pretrained_path: /scratch/xuanweiliu/bimanual_tokenizer/realworld_FAST/AT/checkpoints/latest/pretrained_model
  freeze_action_tokenizer: true
  block_ce_weighting: block_mean
  ce_vocab_scope: full
  name: bar_fast_molmo
  decode_stop_mode: eos
dataset:
  name: bicat_all
  repo_id: local/bicat_box
  root: /scratch/xuanweiliu/bimanual_tokenizer/data/BiCAT-BimanualYAM-Dataset/box
  sources:
  - name: box
    repo_id: local/bicat_box
    root: /scratch/xuanweiliu/bimanual_tokenizer/data/BiCAT-BimanualYAM-Dataset/box
  - name: bottles
    repo_id: local/bicat_bottles
    root: /scratch/xuanweiliu/bimanual_tokenizer/data/BiCAT-BimanualYAM-Dataset/bottles
  - name: pen
    repo_id: local/bicat_pen
    root: /scratch/xuanweiliu/bimanual_tokenizer/data/BiCAT-BimanualYAM-Dataset/pen
  - name: plate
    repo_id: local/bicat_plate
    root: /scratch/xuanweiliu/bimanual_tokenizer/data/BiCAT-BimanualYAM-Dataset/plate
  episodes: null
  action_key: action_joint_angles
  exclude_episodes_file: null
  action_stats_file: null
  observation_keys:
  - observation.state_joint_angles
  - observation.images.top
  - observation.images.left
  - observation.images.right
  video_backend: pyav
  bypass_force_cache_sync: true
trainer:
  max_steps: 30000
  batch_size: 128
  global_batch_size: null
  num_workers: 4
  prefetch_factor: 2
  use_episode_aware_sampler: true
  drop_n_first_frames: 0
  drop_n_last_frames: 0
  weight_decay: 1.0e-06
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-06
  lr_scheduler: cosine
  warmup_steps: 500
  warmup_steps_by_family: null
  min_lr_ratio: 0.1
  lr_decay_steps: null
  use_ema: true
  ema_decay: 0.995
  mixed_precision: bf16
  gradient_accumulation_steps: 1
  find_unused_parameters: false
  max_grad_norm: 1.0
  distributed_strategy: ddp
  fsdp_min_num_params: 100000000
  fsdp_reshard_after_forward: true
  fsdp_cpu_offload: false
  log_every: 10
  val_every: 0
  checkpoint_every: 6000
  checkpoint_start_step: 12000
  checkpoint_dir: ${output_dir}/checkpoints
  local_log_path: ${output_dir}/train_metrics.jsonl
  val_ratio: 0.0
  split_seed: ${seed}
  val_batch_size: null
  max_val_batches: 100
  checkpoint_candidates:
    best:
      metric_key: val_reconst_loss
      mode: min
      k: 0
    recent:
      k: 0
  use_wandb: true
  wandb_project: Realworld
  wandb_entity: null
  wandb_init_timeout: null
  wandb_upload_eval_videos: true
  wandb_max_eval_videos: 16
  _trainer_type: policy
  lrs:
    vlm: 0.0001
    vision: 0.0001
    bridge: 0.0001
  reconst_every: 0
  max_reconst_batches: 100
  reconst_action_mode: policy
  sim_eval_every: null
  sim_eval_start_after_step: 0
  sim_eval:
    num_eval_per_task: 20
    num_parallel_env: 1
    record_episodes_per_task: 0
    step_timeout_sec: null
    rollout_failure_retries: 1
    policy_kwargs: {}
  wandb_required: false
name: train_policy
seed: 1000
device: cuda
run_name: Realworld_BAR_FAST_Molmo2ER_H200_30k
output_dir: /scratch/xuanweiliu/bimanual_tokenizer/realworld_FAST/VLA
run_mode: overwrite
resume_checkpoint: null
env:
  type: null
  task: null
  task_ids: null
  python_bin: null
