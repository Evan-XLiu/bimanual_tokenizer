jobName: praxis-robotwin-clean-50x20-ar-bin-final-ema-step10095-8xh20e-v14
description: Official RoboTwin 2.0 demo_clean evaluation of the final EMA step10095 AR H32 BIN policy; 50 tasks, 20 episodes per task, seen instructions, seed group 0, all 1000 episodes recorded, eight serial task shards on one 8x H20e 141 GB node.
accessType: PRIVATE
imageConfig:
  imageUrl: micr.cloud.mioffice.cn/robot-rfm-lqw/lingbot:3055471-sim-test
  imageCommand: |-
    set -Eeuo pipefail
    COMMIT=a2839204ecf44b19d7e2414e918595f3f8d1ad49
    BASE_REPO=/robot/robot-research-exp-0/user/hxs/praxis-vla
    export PRAXIS_SOURCE_ROOT=/robot/robot-research-exp-0/user/hxs/source-runs/robotwin-clean-50x20-final-ema-20260813-v14-h20e/praxis-vla
    test -d "$BASE_REPO/.git"
    if ! git -C "$BASE_REPO" cat-file -e "$COMMIT^{commit}" 2>/dev/null; then
      git -C "$BASE_REPO" fetch origin hxs/codex/robotwin-integration
    fi
    test ! -e "$PRAXIS_SOURCE_ROOT"
    mkdir -p "$(dirname "$PRAXIS_SOURCE_ROOT")"
    git clone --no-checkout --shared "$BASE_REPO" "$PRAXIS_SOURCE_ROOT"
    git -C "$PRAXIS_SOURCE_ROOT" checkout --detach "$COMMIT"
    test "$(git -C "$PRAXIS_SOURCE_ROOT" rev-parse HEAD)" = "$COMMIT"
    test -z "$(git -C "$PRAXIS_SOURCE_ROOT" status --porcelain --untracked-files=all)"
    exec bash "$PRAXIS_SOURCE_ROOT/artifacts/robotwin_clean_50task_eval_8x4090_20260813_v1/run_eval.sh"
modelUri: ""
juiceFsMountConfigs:
  - volume: robot-research-raw-data-0
    juiceFsCluster: bj9-cloudml-ali2
    subPath: /
    mountPath: /robot/robot-research-raw-data-0
    readOnly: true
  - volume: robot-research-exp-0
    juiceFsCluster: bj9-cloudml-ali2
    subPath: /
    mountPath: /robot/robot-research-exp-0
    readOnly: false
envConfigs:
  - key: NVIDIA_DRIVER_CAPABILITIES
    value: all
queueId: "3649"
priority: 8
preemptible: false
framework: pytorch
resourceConfigs:
  - nodeRole: worker
    nodeNumber: 1
    perNodeResourceSpec:
      resourcePriority: GUARANTEED_PUBLIC
      resourceName: cloudml.ng1h20e-8-8.20-224
      resourceNumber: 8
    elastic: false
    preemptible: false
enableTensorboard: false
enableMetrics: false
retryConfig:
  enableRetry: false
  maxRetryTimes: 0
  policySets: []
rdma: false
