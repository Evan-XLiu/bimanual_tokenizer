<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest 输入采集</title>
<style>
  body { background: #111923; color: #eaf0f8; font: 18px system-ui; max-width: 900px; margin: 32px auto; padding: 16px; }
  button, select, input { font: inherit; padding: 12px; margin: 5px; border-radius: 8px; }
  button { background: #8fd6bc; border: 0; cursor: pointer; }
  button:disabled { opacity: .5; }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #202e3e; padding: 16px; border-radius: 12px; }
  #overlay:xr-overlay { background: transparent; padding: 25px; color: white; }
  #overlay:xr-overlay .setup { display: none; }
  #overlay:xr-overlay pre { max-width: 600px; font-size: 16px; }
</style>
<main id="overlay">
  <h1>Quest 双手柄输入采集</h1>
  <p class="setup">Quest 浏览器进入 XR 后自动录制一个 episode。电脑打开同一地址可查看接收状态。</p>
  <p class="setup">保存头部、左右手柄位姿、原始按键与事件；这是输入调试数据，尚不包含机器人状态、动作或相机。</p>
  <div class="setup">
    <label>连接码 <input id="token" size="20" autocomplete="off"></label>
    <label>显示 <select id="mode"><option value="immersive-ar">透视 AR</option><option value="immersive-vr">沉浸 VR</option></select></label>
    <button id="start" disabled>进入 XR 并开始录制</button>
  </div>
  <button id="stop" disabled>结束并保存</button>
  <pre id="message">检查浏览器能力…</pre>
  <pre id="status">等待设备连接</pre>
  <p class="setup">每次退出再进入会创建新轨迹。重定位会增加 reference_epoch，离线处理时应在此切段。若头显不显示按钮，可用系统菜单退出 XR。</p>
</main>
<script src="/client.js"></script>
</html>
