[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "praxis"
version = "0.1.0"
description = "Robot policy learning framework for training and evaluating manipulation policies"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    { name = "Chaoqi Liu" },
]
keywords = [
    "robotics",
    "imitation-learning",
    "vision-language-action",
    "action-tokenization",
    "robot-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # PyTorch
    "torch>=2.10.0,<2.11.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torch>=2.7.0,<2.8.0 ; sys_platform != 'linux' or platform_machine != 'aarch64'",
    "torchvision>=0.25.0,<0.26.0 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
    "torchvision>=0.22.0,<0.23.0 ; sys_platform != 'linux' or platform_machine != 'aarch64'",

    # Hugging Face
    "lerobot==0.4.4",
    "datasets>=4.0.0",
    "huggingface-hub>=0.28.0",
    "diffusers>=0.27.0",
    "transformers>=4.57.6,<5",

    # Core
    "numpy>=1.26.0",
    "einops>=0.8.0",
    "pillow>=10.0.0",
    "safetensors>=0.4.0",
    "tqdm>=4.66.0",

    # Config
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",

    # Evaluation and serving integration
    "praxis-remote==0.1.1",
    "praxis-eval==0.1.2",
]

[project.optional-dependencies]
serving = [
    "grpcio>=1.78.0",
    "grpcio-tools>=1.78.0",
    "protobuf>=6.31.1",
]
libero = [
    "praxis-eval[libero]==0.1.2",
]
robocasa = [
    "praxis-eval[robocasa]==0.1.2",
]
robomimic = [
    "praxis-eval[robomimic]==0.1.2",
]
metaworld = [
    "praxis-eval[metaworld]==0.1.2",
]
simpler = [
    "praxis-eval[simpler]==0.1.2",
]
mshab = [
    "praxis-eval[mshab]==0.1.2",
]
logging = [
    "wandb>=0.16.0",
]
qwen = [
    "qwen-vl-utils",
    "peft",
]
smol = [
    "num2words",
    "peft",
]
pali = [
    "peft",
]
all = [
    "praxis[serving]",
    "praxis[libero]",
    "praxis[metaworld]",
    "praxis[mshab]",
    "praxis[robocasa]",
    "praxis[robomimic]",
    "praxis[simpler]",
    "praxis[logging]",
    "praxis[qwen]",
    "praxis[smol]",
    "praxis[pali]",
]

[project.scripts]
praxis-train = "praxis.scripts.train:main"
praxis-eval = "praxis.scripts.eval:main"
praxis-serve = "praxis.scripts.serve:main"
praxis-eval-monitor = "praxis.scripts.eval_monitor:main"

[project.urls]
Homepage = "https://chaoqi-liu.com/praxis"
Source = "https://github.com/Chaoqi-LIU/praxis"
Issues = "https://github.com/Chaoqi-LIU/praxis/issues"
Documentation = "https://chaoqi-liu.com/praxis"

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

# ---------------- Tool Configurations ----------------

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["praxis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests that require external resources (LIBERO, LeRobot datasets)",
]

[dependency-groups]
dev = [
    "basedpyright>=1.34.0",
    "h5py>=3.15.0",
    "pre-commit>=4.0.0",
    "pytest>=9.0.2",
    "ruff>=0.4.0",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
include = [
    "src/praxis",
    "scripts",
]
exclude = [
    "outputs",
    "wandb",
]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "none"
reportMissingModuleSource = "none"
